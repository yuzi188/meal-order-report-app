<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OFA 後台登入</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      --bg: #080b10;
      --panel: #111720;
      --line: #29313d;
      --text: #f6f3e7;
      --muted: #aeb7c2;
      --yellow: #f5c84b;
      --bad: #ff7a59;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .card {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 22px;
    }
    h1 { margin: 0 0 6px; color: var(--yellow); font-size: 24px; }
    p { margin: 0 0 18px; color: var(--muted); }
    label { display: block; margin: 14px 0 6px; color: var(--muted); font-weight: 900; }
    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0d131c;
      color: var(--text);
      padding: 9px 11px;
      font: inherit;
    }
    button {
      width: 100%;
      min-height: 46px;
      margin-top: 18px;
      border: 1px solid var(--yellow);
      border-radius: 8px;
      background: var(--yellow);
      color: #1b1403;
      font: inherit;
      font-weight: 950;
    }
    .status { min-height: 22px; margin-top: 12px; color: var(--bad); }
  </style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>OFA 後台登入</h1>
    <p>登入後才能查看與修改每日成本紀錄。</p>

    <label for="username">帳號</label>
    <input id="username" name="username" autocomplete="username" required>

    <label for="password">密碼</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit">登入</button>
    <div class="status" id="status"></div>
  </form>

  <script>
    const form = document.getElementById("loginForm");
    const statusEl = document.getElementById("status");

    form.addEventListener("submit", async event => {
      event.preventDefault();
      statusEl.textContent = "";
      const payload = {
        username: form.username.value,
        password: form.password.value
      };
      const res = await fetch("/api/admin/login", {
        method: "POST",
        cache: "no-store",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) {
        statusEl.textContent = data.error || "登入失敗";
        return;
      }
      window.location.href = "/admin";
    });
  </script>
</body>
</html>
