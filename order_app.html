<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OFA Order Report</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      color: #f6f3e7;
      background: #080b10;
      --brand: #f5c84b;
      --accent: #ffd84d;
      --line: #29313d;
      --muted: #aeb7c2;
      --soft: #171d26;
      --panel: #111720;
      --panel-2: #0d121a;
      --panel-3: #141b25;
      --danger: #ff8a65;
      --ok: #7bd88f;
      --kh: #68b7ff;
      --tw: #ff9f7a;
      --text: #f6f3e7;
      --button-text: #1b1403;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #080b10; color: var(--text); }
    button, input, select { font: inherit; }
    .app { max-width: 1040px; margin: 0 auto; padding: 12px 12px 30px; }
    .hero {
      margin: -12px -12px 12px;
      padding: 18px 14px 16px;
      background: #101720;
      color: var(--text);
      border-radius: 0 0 8px 8px;
      border-bottom: 1px solid var(--line);
    }
    .hero-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
    .date-text { margin-top: 6px; opacity: .92; font-size: 14px; }
    .pill { border: 1px solid rgba(245,200,75,.48); background: rgba(245,200,75,.12); color: var(--brand); padding: 8px 10px; border-radius: 8px; font-weight: 900; white-space: nowrap; font-size: 13px; }
    .toolbar { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 10px; }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; font-weight: 900; }
    input, select {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,200,75,.18); }
    .section-label { margin: 12px 0 7px; color: var(--muted); font-size: 12px; font-weight: 950; letter-spacing: 0; }
    .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; margin-bottom: 10px; }
    .tab {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--brand);
      font-weight: 950;
    }
    .tab.active { background: var(--brand); color: var(--button-text); border-color: var(--brand); box-shadow: 0 8px 18px rgba(245,200,75,.14); }
    .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
    .metric { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 132px; color: var(--text); position: relative; overflow: hidden; }
    .metric.active { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(245,200,75,.22); }
    .metric-name { color: var(--brand); font-size: 16px; font-weight: 950; }
    .metric-time { float: right; color: var(--muted); font-size: 13px; font-weight: 900; }
    .metric-total { margin-top: 5px; font-size: 28px; line-height: 1; font-weight: 950; }
    .metric-split { margin-top: 7px; display: flex; gap: 5px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
    .split-pill { display: inline-flex; align-items: center; min-height: 24px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 7px; background: var(--panel-2); font-weight: 850; }
    .split-pill.tw { color: var(--tw); }
    .split-pill.healthy { color: var(--ok); }
    .split-pill.kh { color: var(--kh); }
    .menu-list { margin-top: 8px; display: grid; gap: 3px; font-size: 12px; line-height: 1.35; color: #d8dee7; }
    .menu-line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meal-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .meal { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .meal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 12px; background: var(--soft); border-bottom: 1px solid var(--line); }
    .meal-title { color: var(--brand); font-size: 18px; font-weight: 950; }
    .meal-time { color: var(--muted); font-weight: 850; white-space: nowrap; }
    .dishes { padding: 10px 12px 6px; display: grid; gap: 5px; }
    .dish { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; font-size: 14px; line-height: 1.45; }
    .cat { color: var(--muted); font-weight: 900; }
    .dish-name { font-weight: 760; overflow-wrap: anywhere; }
    .photo-panel { margin: 0 12px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); overflow: hidden; }
    .photo-head { display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; color: var(--brand); font-weight: 950; border-bottom: 1px solid var(--line); }
    .photo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px; }
    .photo-card { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); color: var(--text); text-align: left; padding: 0; }
    .photo-card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #05070a; }
    .photo-caption { padding: 7px 8px; font-size: 12px; font-weight: 850; color: #d8dee7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .photo-empty { padding: 12px; color: var(--muted); font-size: 13px; }
    .lightbox { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(0,0,0,.82); }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 80vh; border-radius: 8px; background: #000; }
    .lightbox-caption { position: absolute; left: 18px; right: 18px; bottom: 18px; color: #fff; text-align: center; font-weight: 900; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
    .meal-current { margin: 0 12px 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .meal-current div { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); padding: 8px 7px; text-align: center; }
    .meal-current strong { display: block; font-size: 18px; line-height: 1; margin-bottom: 4px; }
    .meal-current span { color: var(--muted); font-size: 12px; font-weight: 850; }
    .lines { padding: 0 12px 10px; }
    .input-table { width: 100%; min-width: 460px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
    .input-table table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .input-table th, .input-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
    .input-table th { background: var(--soft); color: var(--muted); font-weight: 950; }
    .input-table td:first-child, .input-table th:first-child { text-align: left; padding-left: 8px; }
    .input-table tr:last-child td { border-bottom: 0; }
    .input-table input { min-height: 42px; padding: 6px 8px; background: #0b1119; }
    .location-cell { min-width: 108px; color: var(--brand); font-weight: 950; }
    .location-button { width: 100%; min-height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--brand); font-weight: 950; }
    .location-panel {
      display: none;
      margin-top: 6px;
      padding: 12px 10px;
      border-radius: 18px;
      background: #05070a;
      box-shadow: 0 14px 28px rgba(0,0,0,.28);
      color: #fff;
      min-width: 190px;
    }
    .line.open .location-panel { display: grid; gap: 2px; }
    .location-option {
      min-height: 38px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #fff;
      text-align: left;
      font-weight: 850;
      font-size: 16px;
      padding: 6px 10px 6px 34px;
      position: relative;
    }
    .location-option.active::before {
      content: "\2713";
      position: absolute;
      left: 10px;
      top: 8px;
      font-weight: 950;
    }
    .location-option:active { background: rgba(255,255,255,.12); }
    .count-input { text-align: center; font-size: 20px; font-weight: 950; }
    input[type="date"] { color-scheme: dark; }
    input::placeholder { color: #778292; }
    .remove { min-height: 42px; border: 1px solid rgba(255,138,101,.45); color: #1b1403; background: #ffb257; border-radius: 8px; font-weight: 950; }
    .add-line { width: 100%; min-height: 42px; border: 1px dashed var(--brand); color: var(--brand); background: rgba(245,200,75,.06); border-radius: 8px; font-weight: 950; }
    .actions { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr 116px; gap: 8px; background: rgba(8,11,16,.92); backdrop-filter: blur(10px); padding-top: 10px; margin-top: 10px; }
    button { cursor: pointer; }
    .primary { min-height: 48px; border: 0; border-radius: 8px; background: var(--brand); color: var(--button-text); font-weight: 950; }
    .secondary { min-height: 48px; border: 1px solid var(--brand); border-radius: 8px; background: var(--panel); color: var(--brand); font-weight: 950; }
    .status { min-height: 22px; margin: 9px 0 0; color: var(--muted); font-size: 14px; }
    .status.ok { color: var(--ok); font-weight: 850; }
    .status.err { color: var(--danger); font-weight: 850; }
    .report { margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .report h2 { margin: 0; padding: 11px 12px; color: var(--brand); font-size: 18px; border-bottom: 1px solid var(--line); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
    th { background: var(--soft); color: var(--muted); font-weight: 950; }
    td { color: var(--text); }
    td:first-child, th:first-child { text-align: left; padding-left: 12px; }
    .detail-list { padding: 10px 12px 12px; display: grid; gap: 6px; font-size: 14px; }
    .detail-item { padding: 8px 10px; border-radius: 8px; background: var(--soft); border: 1px solid var(--line); line-height: 1.45; }
    .delivery-report { margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .delivery-toggle {
      width: 100%;
      min-height: 52px;
      border: 0;
      background: var(--soft);
      color: var(--brand);
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 18px;
      font-weight: 950;
    }
    .delivery-toggle span:last-child { color: var(--muted); font-size: 13px; font-weight: 850; }
    .delivery-body { display: none; border-top: 1px solid var(--line); padding: 12px; }
    .delivery-report.open .delivery-body { display: block; }
    .delivery-text {
      margin: 0;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.45;
      color: #f6f3e7;
      background: #0b1119;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }
    .delivery-line { padding: 6px 0; border-bottom: 1px solid rgba(41,49,61,.58); overflow-wrap: anywhere; }
    .delivery-line:last-child { border-bottom: 0; }
    .delivery-title { color: var(--brand); font-size: 18px; font-weight: 950; padding-bottom: 10px; }
    .delivery-meal { color: #ffffff; font-size: 17px; font-weight: 950; background: rgba(245,200,75,.1); border: 1px solid rgba(245,200,75,.32); border-radius: 8px; padding: 9px 10px; margin: 8px 0; }
    .delivery-total { color: #f6f3e7; font-weight: 950; background: rgba(104,183,255,.1); border: 1px solid rgba(104,183,255,.28); border-radius: 8px; padding: 9px 10px; margin-bottom: 6px; }
    .delivery-item { color: #d8dee7; }
    .delivery-place { color: var(--brand); font-weight: 950; }
    .delivery-tw { color: var(--tw); font-weight: 950; }
    .delivery-kh { color: var(--kh); font-weight: 950; }
    .delivery-healthy { color: var(--ok); font-weight: 950; }
    .delivery-box { color: #f6f3e7; font-weight: 950; }
    .delivery-bucket { color: #c9a7ff; font-weight: 950; }
    .delivery-note { color: #ffb257; font-weight: 950; }
    @media (max-width: 760px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .meal-current { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .photo-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .meal-grid, .actions { grid-template-columns: 1fr; }
      .tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="hero-row">
        <div>
          <h1>OFA &#35330;&#39184;&#22238;&#22577;</h1>
          <div class="date-text" id="menuDate">&#36617;&#20837;&#20170;&#26085;&#33756;&#21934;&#20013;</div>
        </div>
        <div class="pill">&#20808;&#36984;&#39184;&#21029;</div>
      </div>
    </section>

    <section class="toolbar">
      <div>
        <label for="dateInput">&#26085;&#26399;</label>
        <input id="dateInput" type="date">
      </div>
    </section>

    <div class="section-label">&#37096;&#38272;</div>
    <section class="tabs" id="departmentTabs"></section>
    <div class="section-label">&#20170;&#26085;&#22235;&#39184;</div>
    <section class="cards" id="summaryCards"></section>
    <div class="section-label">&#20154;&#25976;&#22238;&#22577;</div>
    <section class="meal-grid" id="meals"></section>

    <section class="actions">
      <button class="primary" id="submit">&#36865;&#20986;&#22238;&#22577;</button>
      <button class="secondary" id="reload">&#26356;&#26032;</button>
    </section>
    <p class="status" id="status"></p>

    <section class="report">
      <h2 id="reportTitle">&#20170;&#26085;&#32113;&#35336;</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>&#39184;&#21029;</th>
              <th>&#21488;&#39184;</th>
              <th>&#20581;&#24247;&#39184;</th>
              <th>&#26596;&#22484;&#23528;&#39184;</th>
              <th>&#21512;&#35336;</th>
            </tr>
          </thead>
          <tbody id="summaryRows"></tbody>
        </table>
      </div>
      <div class="detail-list" id="detailRows"></div>
    </section>

    <section class="delivery-report" id="deliveryReport">
      <button type="button" class="delivery-toggle" id="deliveryToggle">
        <span>&#36865;&#39184;&#32317;&#34920;</span>
        <span id="deliveryHint">&#40670;&#25802;&#25171;&#38283;</span>
      </button>
      <div class="delivery-body">
        <pre class="delivery-text" id="deliveryText">&#36865;&#39184;&#32317;&#34920;&#36617;&#20837;&#20013;...</pre>
      </div>
    </section>
  </main>
  <div class="lightbox" id="photoLightbox" role="button" tabindex="0" aria-label="關閉照片">
    <img id="lightboxImage" alt="">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <script>
    const t = {
      app: "\u8a02\u9910\u56de\u5831",
      todayLoading: "\u8f09\u5165\u4eca\u65e5\u83dc\u55ae\u4e2d",
      todayMenu: "\u4eca\u65e5\u83dc\u8272",
      loadFail: "\u83dc\u55ae\u8f09\u5165\u5931\u6557",
      atLeastOne: "\u8acb\u81f3\u5c11\u586b\u4e00\u7b46\u4eba\u6578",
      submitFail: "\u9001\u51fa\u5931\u6557",
      submitted: "\u5df2\u9001\u51fa\uff0c\u53ef\u4ee5\u4fee\u6539\u5f8c\u518d\u9001\u4e00\u6b21\u3002",
      noReport: "\u5c1a\u672a\u6709\u4eba\u56de\u5831",
      addLine: "\u65b0\u589e\u4e00\u5217",
      del: "\u522a",
      notePlaceholder: "\u5099\u8a3b\uff1a\u4e0d\u5403\u8c6c\u3001\u4e0d\u5403\u725b\u3001\u4e0d\u5403\u6d77\u9bae\u3001\u5065\u5eb7\u9910\u3001\u5305\u98ef\u76d2",
      taiwan: "\u53f0\u9910",
      healthy: "\u5065\u5eb7\u9910",
      cambodia: "\u67ec\u57d4\u5be8\u9910",
      portion: "\u4efd"
    };
    const mealNames = { breakfast: "\u65e9\u9910", lunch: "\u5348\u9910", dinner: "\u665a\u9910", late_night: "\u5bb5\u591c" };
    const cuisineNames = { taiwan: t.taiwan, healthy: t.healthy, cambodia: t.cambodia };
    let currentDate = "";
    let currentMenu = null;
    let currentSummary = null;
    let deliveryLocations = [];
    let unitDeliveryLocations = {};
    let departments = [];
    let activeDepartment = "";
    let activeMeal = "breakfast";
    let imageRequestId = 0;
    let deliveryTableText = "";

    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    function todayTaipei() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit"
      }).formatToParts(new Date());
      const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
      return `${map.year}-${map.month}-${map.day}`;
    }

    function setStatus(text, type = "") {
      const el = document.getElementById("status");
      el.className = `status ${type}`;
      el.textContent = text;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    async function load(date = todayTaipei()) {
      currentDate = date;
      document.getElementById("dateInput").value = date;
      const res = await fetch(`/api/today?date=${encodeURIComponent(date)}&_=${Date.now()}`, { cache: "no-store" });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || t.loadFail);
      currentMenu = data.menu;
      deliveryLocations = data.delivery_locations || [];
      unitDeliveryLocations = data.unit_delivery_locations || {};
      departments = data.units || [];
      if (!activeDepartment || !departments.includes(activeDepartment)) activeDepartment = departments[0] || "";
      currentSummary = data.summary;
      renderDepartmentTabs();
      renderMeals(data.menu);
      renderSummary(data.summary);
      loadDeliveryTable().catch(() => renderDeliveryTable(""));
      setStatus("");
    }

    function renderDepartmentTabs() {
      document.getElementById("departmentTabs").innerHTML = departments.map(unit => `
        <button type="button" class="tab ${unit === activeDepartment ? "active" : ""}" data-department="${unit}">${unit}</button>
      `).join("");
    }

    function locationButtons(selected) {
      return visibleLocations().map(x => `
        <button type="button" class="location-option ${x === selected ? "active" : ""}" data-location-choice="${escapeHtml(x)}">${escapeHtml(x)}</button>
      `).join("");
    }

    function visibleLocations() {
      if (unitDeliveryLocations[activeDepartment]) return unitDeliveryLocations[activeDepartment];
      return deliveryLocations.length ? [deliveryLocations[0]] : [];
    }

    function lineTemplate(mealKey, lineIndex, taiwanCount = 0, healthyCount = 0, cambodiaCount = 0, location = "") {
      const locations = visibleLocations();
      const selectedLocation = locations.includes(location) ? location : (locations[0] || "");
      return `
        <tr class="line" data-line="${lineIndex}" data-location="${escapeHtml(selectedLocation)}">
          <td class="location-cell">
            <button type="button" class="location-button" data-toggle-location>${escapeHtml(selectedLocation)}</button>
            <div class="location-panel">${locationButtons(selectedLocation)}</div>
          </td>
          <td><input class="count-input" type="number" min="0" step="1" inputmode="numeric" data-field="taiwan_count" value="${taiwanCount}"></td>
          <td><input class="count-input" type="number" min="0" step="1" inputmode="numeric" data-field="healthy_count" value="${healthyCount}"></td>
          <td><input class="count-input" type="number" min="0" step="1" inputmode="numeric" data-field="cambodia_count" value="${cambodiaCount}"></td>
          <td><button class="remove" type="button" data-remove-line>${t.del}</button></td>
        </tr>
      `;
    }

    function addLine(mealKey) {
      const box = document.querySelector(`[data-lines="${mealKey}"]`);
      box.insertAdjacentHTML("beforeend", lineTemplate(mealKey, box.querySelectorAll(".line").length + 1));
    }

    function countsForLocation(mealKey, location) {
      const counts = { taiwan: 0, healthy: 0, cambodia: 0 };
      const rows = (currentSummary && currentSummary.rows) || [];
      rows.forEach(row => {
        if (row.unit === activeDepartment && row.meal_key === mealKey && row.delivery_location === location && counts[row.cuisine] !== undefined) {
          counts[row.cuisine] += Number(row.count || 0);
        }
      });
      return counts;
    }

    function currentMealTotal(mealKey) {
      if (!currentSummary) return { taiwan: 0, healthy: 0, cambodia: 0, total: 0 };
      return currentSummary.totals[mealKey] || { taiwan: 0, healthy: 0, cambodia: 0, total: 0 };
    }

    function photoCard(item) {
      if (!item.image_url) return "";
      return `
        <button type="button" class="photo-card" data-photo-src="${escapeHtml(item.image_url)}" data-photo-title="${escapeHtml(item.dish)}">
          <img src="${escapeHtml(item.image_url)}" alt="${escapeHtml(item.dish)}" loading="lazy" referrerpolicy="no-referrer">
          <div class="photo-caption">${escapeHtml(item.dish)}</div>
        </button>
      `;
    }

    function renderMealPhotos(items, loading = false) {
      const box = document.getElementById("mealPhotos");
      if (!box) return;
      if (loading) {
        box.innerHTML = `<div class="photo-empty">菜色照片載入中...</div>`;
        return;
      }
      const cards = (items || []).map(photoCard).join("");
      box.innerHTML = cards ? `<div class="photo-grid">${cards}</div>` : `<div class="photo-empty">目前沒有照片</div>`;
    }

    async function loadMealImages(mealKey) {
      const requestId = ++imageRequestId;
      renderMealPhotos([], true);
      try {
        const res = await fetch(`/api/menu-images?date=${encodeURIComponent(currentDate)}&meal=${encodeURIComponent(mealKey)}&_=${Date.now()}`, { cache: "no-store" });
        const data = await res.json();
        if (requestId !== imageRequestId) return;
        if (!res.ok) throw new Error(data.error || "照片載入失敗");
        const meal = (data.meals || [])[0];
        renderMealPhotos(meal ? meal.items : []);
      } catch (_err) {
        if (requestId === imageRequestId) renderMealPhotos([]);
      }
    }

    function renderMeals(menu) {
      document.getElementById("menuDate").textContent = `${menu.display_date} ${t.todayMenu}`;
      const meal = menu.meals.find(item => item.key === activeMeal) || menu.meals[0];
      if (!meal) return;
      activeMeal = meal.key;
      const dishes = meal.items
        .filter(item => item.dish)
        .map(item => `
          <div class="dish">
            <div class="cat">${escapeHtml(item.category)}</div>
            <div class="dish-name">${escapeHtml(item.dish)}</div>
          </div>
        `)
        .join("");
      const activeTotal = currentMealTotal(meal.key);
      document.getElementById("meals").innerHTML = `
        <article class="meal" data-meal="${meal.key}">
          <div class="meal-head">
            <div class="meal-title">${escapeHtml(meal.label)}</div>
            <div class="meal-time">${escapeHtml(meal.time)}</div>
          </div>
          <div class="dishes">${dishes}</div>
          <div class="photo-panel">
            <div class="photo-head"><span>菜色照片</span><span>${escapeHtml(meal.time)}</span></div>
            <div id="mealPhotos"><div class="photo-empty">菜色照片載入中...</div></div>
          </div>
          <div class="meal-current">
            <div><strong>${activeTotal.total}</strong><span>合計</span></div>
            <div><strong>${activeTotal.taiwan}</strong><span>台餐</span></div>
            <div><strong>${activeTotal.healthy}</strong><span>健康餐</span></div>
            <div><strong>${activeTotal.cambodia}</strong><span>柬餐</span></div>
          </div>
          <div class="lines table-wrap">
            <div class="input-table">
              <table>
                <thead>
                  <tr>
                    <th>\u9001\u9910\u5730\u9ede</th>
                    <th>${t.taiwan}</th>
                    <th>${t.healthy}</th>
                    <th>${t.cambodia}</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody data-lines="${meal.key}">
                  ${visibleLocations().map((location, index) => {
                    const counts = countsForLocation(meal.key, location);
                    return lineTemplate(meal.key, index + 1, counts.taiwan, counts.healthy, counts.cambodia, location);
                  }).join("")}
                </tbody>
              </table>
            </div>
          </div>
          <div style="padding:0 12px 12px">
            <button class="add-line" type="button" data-add-line="${meal.key}">${t.addLine}</button>
          </div>
        </article>
      `;
      loadMealImages(meal.key);
    }

    function renderSummary(summary) {
      currentSummary = summary;
      const entries = currentMenu ? currentMenu.meals.map(meal => [meal.key, summary.totals[meal.key] || { taiwan: 0, healthy: 0, cambodia: 0, total: 0 }, meal]) : [];
      document.getElementById("summaryCards").innerHTML = entries.map(([key, row, meal]) => {
        const menuLines = meal.items
          .filter(item => item.dish)
          .map(item => `<div class="menu-line">${escapeHtml(item.category)} ${escapeHtml(item.dish)}</div>`)
          .join("");
        return `
          <button type="button" class="metric ${key === activeMeal ? "active" : ""}" data-meal-tab="${key}">
            <div class="metric-name">${mealNames[key]} <span class="metric-time">${escapeHtml(meal.time)}</span></div>
            <div class="metric-total">${row.total}</div>
            <div class="metric-split">
              <span class="split-pill tw">台 ${row.taiwan}</span>
              <span class="split-pill healthy">健 ${row.healthy}</span>
              <span class="split-pill kh">柬 ${row.cambodia}</span>
            </div>
            <div class="menu-list">${menuLines}</div>
          </button>
        `;
      }).join("");

      const activeTotal = summary.totals[activeMeal] || { taiwan: 0, healthy: 0, cambodia: 0, total: 0 };
      document.getElementById("reportTitle").textContent = `${mealNames[activeMeal]} ${t.todayMenu}`;
      document.getElementById("summaryRows").innerHTML = `
        <tr>
          <td>${mealNames[activeMeal]}</td>
          <td>${activeTotal.taiwan}</td>
          <td>${activeTotal.healthy}</td>
          <td>${activeTotal.cambodia}</td>
          <td>${activeTotal.total}</td>
        </tr>
      `;

      document.getElementById("detailRows").innerHTML = "";
    }

    function collectEntries() {
      const entries = [];
      document.querySelectorAll("[data-lines]").forEach(box => {
        const mealKey = box.dataset.lines;
        box.querySelectorAll(".line").forEach((line, index) => {
          const taiwanCount = Number(line.querySelector('[data-field="taiwan_count"]').value || 0);
          const healthyCount = Number(line.querySelector('[data-field="healthy_count"]').value || 0);
          const cambodiaCount = Number(line.querySelector('[data-field="cambodia_count"]').value || 0);
          const deliveryLocation = line.dataset.location || deliveryLocations[0] || "";
          if (taiwanCount > 0) {
            entries.push({
              meal_key: mealKey,
              cuisine: "taiwan",
              count: taiwanCount,
              delivery_location: deliveryLocation,
              note: "",
              line_key: `${mealKey}-${index + 1}-taiwan`
            });
          }
          if (healthyCount > 0) {
            entries.push({
              meal_key: mealKey,
              cuisine: "healthy",
              count: healthyCount,
              delivery_location: deliveryLocation,
              note: "",
              line_key: `${mealKey}-${index + 1}-healthy`
            });
          }
          if (cambodiaCount > 0) {
            entries.push({
              meal_key: mealKey,
              cuisine: "cambodia",
              count: cambodiaCount,
              delivery_location: deliveryLocation,
              note: "",
              line_key: `${mealKey}-${index + 1}-cambodia`
            });
          }
        });
      });
      return entries;
    }

    async function submitReport() {
      const entries = collectEntries();
      if (!entries.length) throw new Error(t.atLeastOne);
      const payload = { date: currentDate, unit: activeDepartment, entries };
      const res = await fetch("/api/report", {
        method: "POST",
        cache: "no-store",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || t.submitFail);
      setStatus(`${activeDepartment} ${t.submitted}`, "ok");
      if (window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
        Telegram.WebApp.HapticFeedback.notificationOccurred("success");
      }
      await refreshSummary();
    }

    async function refreshSummary() {
      const res = await fetch(`/api/summary?date=${encodeURIComponent(currentDate)}&_=${Date.now()}`, { cache: "no-store" });
      const data = await res.json();
      currentSummary = data.summary;
      renderSummary(data.summary);
      renderMeals(currentMenu);
      await loadDeliveryTable();
    }

    function renderDeliveryTable(text) {
      deliveryTableText = text || "";
      document.getElementById("deliveryText").textContent = deliveryTableText || "目前沒有送餐資料";
    }

    async function loadDeliveryTable() {
      const res = await fetch(`/api/delivery-table?date=${encodeURIComponent(currentDate)}&meal=${encodeURIComponent(activeMeal)}&_=${Date.now()}`, { cache: "no-store" });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "送餐總表載入失敗");
      renderDeliveryTable(data.text || "");
    }

    function colorizeDeliveryTable(text) {
      return String(text || "").split("\n").map(line => {
        if (!line.trim()) return `<div class="delivery-line"></div>`;
        let cls = "delivery-line delivery-item";
        if (line.includes("送餐總表")) cls = "delivery-line delivery-title";
        else if (/^(早餐|午餐|晚餐|宵夜)/.test(line)) cls = "delivery-line delivery-meal";
        else if (line.includes("共")) cls = "delivery-line delivery-total";
        const escaped = escapeHtml(line)
          .replaceAll("🇹🇼", `<span class="delivery-tw">🇹🇼</span>`)
          .replaceAll("🇰🇭", `<span class="delivery-kh">🇰🇭</span>`)
          .replaceAll("健康餐🥦", `<span class="delivery-healthy">健康餐🥦</span>`)
          .replaceAll("🍱", `<span class="delivery-box">🍱</span>`)
          .replaceAll("🪣", `<span class="delivery-bucket">🪣</span>`)
          .replaceAll("🐷不吃豬", `<span class="delivery-note">🐷不吃豬</span>`)
          .replaceAll("🐮不吃牛", `<span class="delivery-note">🐮不吃牛</span>`)
          .replaceAll("🦞不吃海鮮", `<span class="delivery-note">🦞不吃海鮮</span>`)
          .replace(/^(1001 3A|1002-2代理|1002-3金流|1002-2客服|MT-3F|包飯盒|68公寓|88公寓|保姆 68|保姆 88|海南雞飯|健康餐🥦-3F|🐷不吃豬|🐮不吃牛|🦞不吃海鮮)/, `<span class="delivery-place">$1</span>`);
        return `<div class="${cls}">${escaped}</div>`;
      }).join("");
    }

    renderDeliveryTable = function(text) {
      deliveryTableText = text || "";
      document.getElementById("deliveryText").innerHTML = colorizeDeliveryTable(deliveryTableText || "目前沒有送餐資料");
    };

    async function autoRefresh() {
      const today = todayTaipei();
      if (currentDate !== today && document.getElementById("dateInput").value === currentDate) {
        await load(today);
        return;
      }
      await refreshSummary();
    }

    document.addEventListener("click", event => {
      const department = event.target.dataset.department;
      if (department) {
        activeDepartment = department;
        renderDepartmentTabs();
        refreshSummary().catch(err => setStatus(err.message, "err"));
      }
      const mealTab = event.target.closest("[data-meal-tab]")?.dataset.mealTab;
      if (mealTab) {
        activeMeal = mealTab;
        renderMeals(currentMenu);
        renderSummary(currentSummary);
        loadDeliveryTable().catch(err => setStatus(err.message, "err"));
      }
      const addMeal = event.target.dataset.addLine;
      if (addMeal) addLine(addMeal);
      if (event.target.dataset.toggleLocation !== undefined) {
        const line = event.target.closest(".line");
        line.classList.toggle("open");
      }
      const locationChoice = event.target.dataset.locationChoice;
      if (locationChoice) {
        const line = event.target.closest(".line");
        line.dataset.location = locationChoice;
        line.querySelector("[data-toggle-location]").textContent = locationChoice;
        line.querySelectorAll(".location-option").forEach(button => {
          button.classList.toggle("active", button.dataset.locationChoice === locationChoice);
        });
        line.classList.remove("open");
      }
      if (event.target.dataset.removeLine !== undefined) {
        const box = event.target.closest("[data-lines]");
        if (box.querySelectorAll(".line").length > 1) event.target.closest(".line").remove();
      }
      const photoButton = event.target.closest("[data-photo-src]");
      if (photoButton) {
        document.getElementById("lightboxImage").src = photoButton.dataset.photoSrc;
        document.getElementById("lightboxImage").alt = photoButton.dataset.photoTitle || "";
        document.getElementById("lightboxCaption").textContent = photoButton.dataset.photoTitle || "";
        document.getElementById("photoLightbox").classList.add("open");
      }
      if (event.target.closest("#deliveryToggle")) {
        const report = document.getElementById("deliveryReport");
        report.classList.toggle("open");
        document.getElementById("deliveryHint").textContent = report.classList.contains("open") ? "點擊收合" : "點擊打開";
      }
    });

    document.getElementById("photoLightbox").addEventListener("click", () => {
      document.getElementById("photoLightbox").classList.remove("open");
      document.getElementById("lightboxImage").src = "";
    });
    document.getElementById("photoLightbox").addEventListener("keydown", event => {
      if (event.key === "Escape" || event.key === "Enter" || event.key === " ") {
        document.getElementById("photoLightbox").classList.remove("open");
        document.getElementById("lightboxImage").src = "";
      }
    });

    document.getElementById("submit").addEventListener("click", () => submitReport().catch(err => setStatus(err.message, "err")));
    document.getElementById("reload").addEventListener("click", () => refreshSummary().catch(err => setStatus(err.message, "err")));
    document.getElementById("dateInput").addEventListener("change", event => load(event.target.value).catch(err => setStatus(err.message, "err")));
    load().catch(err => setStatus(err.message, "err"));
    setInterval(() => autoRefresh().catch(() => {}), 30000);
  </script>
</body>
</html>
